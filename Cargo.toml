[package]
name = "postg"
version = "0.1.6"
edition = "2021"
license = "MIT"
authors = ["Oonid <oonid@github.com>"]
description = "Embedded PostgreSQL manager for Rust"
repository = "https://github.com/oonid/postg-rs"
homepage = "https://github.com/oonid/postg-rs"
keywords = ["postgresql", "embedded", "database", "testing", "parquet"]
categories = ["database", "development-tools::testing"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
anyhow = "1"
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["blocking"] }
indicatif = "0.18.6"
postg-macros = { version = "0.1.6", path = "postg-macros", optional = true }

# Parquet feature dependencies
postg-arrow = { version = "0.1.6", path = "postg-arrow", optional = true }
parquet = { version = "59.2.0", features = ["async", "arrow"], optional = true }
arrow = { version = "59.2.0", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = ["macros"]
macros = ["postg-macros"]
parquet = ["dep:postg-arrow", "dep:parquet", "dep:arrow", "dep:futures"]

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
predicates = "3.1.4"
tokio-test = "0.4"

[workspace]
members = [
    ".",
    "postg-macros",
    "postg-arrow"
]
