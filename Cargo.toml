[package]
name = "postg"
version = "0.1.2"
edition = "2021"
authors = ["Oonid <oonid@github.com>"]
description = "Embedded PostgreSQL manager for Rust"

[dependencies]
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
anyhow = "1"
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["blocking"] }
indicatif = "0.18.6"
postg-macros = { version = "0.1.0", path = "postg-macros", optional = true }
connector_arrow = { git = "https://github.com/oonid/connector_arrow.git", branch = "feat-sqlx", features = ["src_sqlx_postgres"] }
parquet = { version = "58.0.0", features = ["async", "arrow"] }
arrow = { version = "58.0.0" }
futures = "0.3"

[features]
default = ["macros"]
macros = ["postg-macros"]

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
predicates = "3.1.4"
tokio-test = "0.4"
