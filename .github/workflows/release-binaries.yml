name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger automatically when you push a tag like v1.0.0
  workflow_dispatch:  # Allow manual triggering from the GitHub UI

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Build Standard PostgreSQL Binaries
        run: |
          chmod +x ./scripts/extract-pg-from-docker.sh
          PG_MAJORS="18 17" ENGINE=postgresql ./scripts/extract-pg-from-docker.sh

      - name: Build Spock PostgreSQL Binaries
        run: |
          PG_MAJORS="18 17" ENGINE=spock ./scripts/extract-pg-from-docker.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build postg CLI (x86_64)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/postg ./postg-x86_64-linux

      - name: Build postg CLI (aarch64)
        run: |
          cross build --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/postg ./postg-aarch64-linux

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            postg-x86_64-linux
            postg-aarch64-linux
          generate_release_notes: true
