[package]
name = "postg-arrow"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", default-features = false, features = ["postgres"] }
arrow = { version = "59.2.0" }
futures = "0.3"
bytes = "1"
postgres-types = { version = "0.2", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
postgres-protocol = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
anyhow = "1"
async-stream = "0.3.6"
